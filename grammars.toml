# Grammars this repository compiles to WebAssembly (see build.py).
#
# `language` names the module file and the manifest entry; consumers map it to
# their own language ids. `dir` is the grammar directory inside the crate
# (holding `src/parser.c`) when it is not the crate root.

# tree-sitter-cli that builds every module. The wasm ABI follows its version:
# consumers must load the modules with a tree-sitter runtime of the same minor.
tree_sitter = "0.25.10"

[[grammar]]
language = "astro"
crate = "tree-sitter-astro-next"
version = "0.1.1"

[[grammar]]
language = "clojure"
crate = "tree-sitter-clojure"
version = "0.1.0"
dir = "grammar-src"

